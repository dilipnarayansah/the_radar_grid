name: the_radar_grid
description: Hyperlocal Offline-First P2P Radar Grid
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  geolocator: ^10.1.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.0.0
  sqflite: ^2.4.1
  path_provider: ^2.1.4
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  http: ^1.2.0
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "web/icons/Icon-512.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
